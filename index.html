<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>fedithread</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1><a href="./">fedithread</a></h1>
    <form id="form" autocomplete="off">
      <input id="url" type="text" name="url" placeholder="Paste a link to any post in a thread, e.g. https://mastodon.social/@user/1234567890" spellcheck="false" required>
      <button type="submit">Read</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <p id="home-row">
      <label for="home">Reply via your instance:</label>
      <input id="home" type="text" placeholder="mastodon.example" spellcheck="false" autocomplete="off" size="22">
      <span id="home-hint" class="muted"></span>
    </p>
    <div id="toolbar" hidden>
      <button id="expand-all" type="button">Expand all forks</button>
      <button id="collapse-all" type="button">Collapse all forks</button>
      <button id="share" type="button" title="Copy a link that reopens this thread. It contains only the post address: the instance you read it through and the post id.">Share</button>
      <span class="save">
        <span class="muted">Save as</span>
        <button id="save-html" type="button" title="Download the thread as a standalone web page">HTML</button>
        <button id="save-md" type="button" title="Download the thread as a Markdown document">Markdown</button>
        <label title="Include replies from other people as a Replies section"><input id="save-forks" type="checkbox" checked> with forks</label>
      </span>
    </div>
    <p id="share-row" hidden>
      <label for="share-link">Share link:</label>
      <input id="share-link" type="text" readonly spellcheck="false" autocomplete="off">
      <span id="share-hint" class="muted" aria-live="polite"></span>
    </p>
  </header>
  <main id="thread"></main>
  <footer class="bottom">
    <p>Reads public threads anonymously via the Mastodon API. The original poster's own replies form the main line; replies from others are collapsed forks. Nothing is stored or sent anywhere but the instance in the link.</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
